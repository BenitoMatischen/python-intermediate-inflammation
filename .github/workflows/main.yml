# Same key-value pairs as in "Defining Our Workflow" section
name: CI
# We can specify which Github events will trigger a CI build
on: push  # Trigger on push

# now define a single job 'build' (but could define more)
jobs:
  build:

    # Here we add the build matrices definition:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.11", "3.12", "3.13"]

    # Here we add the reference to the os matrix values
    # to specify what OS to run this on
    runs-on: ${{ matrix.os }}

    # Same key-value pairs as in "Defining Our Workflow" section
    steps:

    # Next we need to checkout out repository, and set up Python
    # A 'name' is just an optional label shown in the log
    # helpful to clarify progress - and can be anything
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }} ${{ matrix.os }}
      uses: actions/setup-python@v6
      with:
        # Here we add the reference to the python-version matrix values
        # to specify what python version to use
        python-version: ${{ matrix.python-version }}
    
    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install -r requirements.txt .
    - name: Test with PyTest
      run: |
        python3 -m pytest --cov=inflammation.models tests/test_models.py